<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="61">
  <!-- The 61 mark: a value cell from the night-studio board, lit in amber.
       Phase 9 version; assets/icons/*.png are rendered from this file. -->
  <defs>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2360"/>
      <stop offset="1" stop-color="#1C1840"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="60%" r="60%">
      <stop offset="0" stop-color="#FFB347" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFB347" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="6" y="6" width="108" height="108" rx="22" fill="url(#cell)"/>
  <rect x="6" y="6" width="108" height="108" rx="22" fill="url(#glow)"/>
  <rect x="7.5" y="7.5" width="105" height="105" rx="21" fill="none" stroke="#FFB347" stroke-opacity="0.55" stroke-width="3"/>
  <text x="60" y="84" text-anchor="middle" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="64" font-weight="700" fill="#FFC56B" letter-spacing="-3" style="paint-order:stroke" stroke="#FFC56B" stroke-opacity="0.25" stroke-width="6">61</text>
</svg>
