# Puts the game live on GitHub Pages at https://jxstrr0.github.io/61/
#
# Runs on every push to main. Each run:
#   1. runs the tests, and STOPS if they fail, so the live site keeps the
#      last version that worked,
#   2. copies the site's files into a folder called _site (as-is, no build),
#      leaving out .github and test,
#   3. publishes _site to Pages.
#
# Settings → Pages → Source must be "GitHub Actions". The configure-pages
# step tries to switch that on by itself the first time it runs.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run the tests
        run: npm test

      - name: Copy the site into _site
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/test

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
