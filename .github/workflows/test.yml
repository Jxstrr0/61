# Runs the test suite (node --test) on every push and pull request.
# No packages are installed: the repo has no dependencies on purpose.
name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node --test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
